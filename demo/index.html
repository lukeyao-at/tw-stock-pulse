<script>
(function () {
const Sentiment = (function () {
/**
 * 中文財經新聞的利多/利空判讀。
 *
 * 刻意用「詞典 + 權重」而不是機器學習：台股新聞標題的用語高度固定
 * （「上調目標價」、「外資買超」、「財測下修」），詞典的準確度夠用，
 * 而且結果可解釋、可測試、不需要任何外部服務或 API key。
 *
 * 權重 3 = 強訊號（法人動作、財測），2 = 中，1 = 弱/情緒性。
 */

const BULLISH = [
  ['漲停', 3], ['創新高', 3], ['大漲', 3], ['飆', 3], ['上調目標價', 3], ['調升評等', 3],
  ['外資買超', 3], ['法人買超', 3], ['投信買超', 3], ['財測上修', 3], ['上修', 3],
  ['營收創高', 3], ['獲利創高', 3], ['擴產', 2], ['新訂單', 2], ['大單', 2], ['轉單', 2],
  ['營收成長', 2], ['獲利成長', 2], ['營收增', 2], ['接單', 2], ['進補', 2], ['題材', 2],
  ['除息填息', 2], ['填息', 2], ['配息', 2], ['現金股利', 2], ['股利', 1], ['殖利率', 1],
  ['買進', 2], ['加碼', 2], ['看好', 2], ['樂觀', 2], ['受惠', 2], ['優於預期', 3],
  ['旺季', 2], ['回升', 2], ['止跌', 1], ['反彈', 1], ['站上', 1], ['走揚', 1],
  ['成長', 1], ['突破', 1], ['強勢', 1], ['亮眼', 2], ['告捷', 2], ['奪', 1], ['得標', 2],
];

const BEARISH = [
  ['跌停', 3], ['崩', 3], ['重挫', 3], ['大跌', 3], ['創新低', 3], ['下修', 3],
  ['調降評等', 3], ['降評', 3], ['下調目標價', 3], ['外資賣超', 3], ['法人賣超', 3],
  ['投信賣超', 3], ['財測下修', 3], ['虧損', 3], ['認賠', 3], ['減資', 3], ['爆雷', 3],
  ['違約', 3], ['訴訟', 2], ['遭罰', 2], ['裁員', 3], ['停工', 3], ['關廠', 3], ['召回', 2],
  ['砍單', 3], ['庫存', 1], ['去化', 1], ['衰退', 3], ['營收衰退', 3], ['營收減', 2],
  ['不如預期', 3], ['低於預期', 3], ['遜於預期', 3], ['淡季', 2], ['疑慮', 2], ['觀望', 1],
  ['賣出', 2], ['減碼', 2], ['看壞', 2], ['保守', 1], ['壓力', 1], ['回檔', 2],
  ['摔', 2], ['失守', 2], ['走弱', 2], ['疲軟', 2], ['降價', 1], ['殺價', 2], ['虧', 2],
  ['警訊', 2], ['風險', 1], ['調查', 2], ['停牌', 3], ['處分', 2], ['列管', 2],
];

/**
 * 否定詞：出現在利多詞「前面」時要翻轉極性。
 * 例：「不看好」、「未能突破」、「無法填息」。
 */
const NEGATORS = ['不', '未', '無法', '難以', '沒有', '沒', '免', '非'];

/**
 * 推測語境：預測/傳聞不該和已實現的事實同權重。
 *
 * 一定要用詞組或正則，不能用單字。用單字 `傳` 會把「傳統封測」誤判成
 * 傳聞、用單字 `疑` 會把「產生疑慮」（本身是利空事實）誤判成推測，
 * 兩者都會讓分數被錯誤打折。
 */
const HEDGES = [
  // 「傳鴻海遭砍單」這種「傳＋公司名」是台股新聞最常見的傳聞句式，
  // 所以要保留單字 傳，但排除它的正常複合詞（傳統、傳產、傳媒…）。
  /傳(?!統|產|承|遞|達|播|送|輸|染|奇|真|記|媒|銷)/,
  /外傳/, /據傳/,
  /有望/, /有機會/, /可能/, /預估/, /預料/, /料將/, /上看/,
  // 「恐再降價」是推測，但「恐慌」「恐懼」是情緒詞，要排除
  /恐(?!慌|懼|嚇)/,
  /疑似/,
];

const NEG_WINDOW = 3; // 否定詞需緊鄰（3 字內）才算修飾該詞

function scanTerms(text, table, polarity) {
  const hits = [];
  for (const [term, weight] of table) {
    let from = 0;
    for (;;) {
      const at = text.indexOf(term, from);
      if (at === -1) break;

      const before = text.slice(Math.max(0, at - NEG_WINDOW), at);
      const negated = NEGATORS.some((n) => before.includes(n));
      hits.push({ term, weight, negated, at, end: at + term.length, polarity });

      from = at + term.length;
    }
  }
  return hits;
}

/**
 * 去掉被更長的詞完全覆蓋的命中。
 *
 * 詞典裡有「財測下修」也有「下修」，同一段文字會兩個都命中，
 * 不處理的話同一件事被計分兩次（-3 + -3），分數與信心度都會虛胖。
 * 保留較長（較具體）的那個，因為它的權重才是為這個語境訂的。
 */
function dropOverlaps(hits) {
  const sorted = [...hits].sort((a, b) => b.end - b.at - (a.end - a.at));
  const kept = [];
  for (const hit of sorted) {
    const covered = kept.some((k) => hit.at >= k.at && hit.end <= k.end);
    if (!covered) kept.push(hit);
  }
  return kept;
}

/**
 * 判讀一則新聞的情緒。
 * @returns {{label:'利多'|'利空'|'中性', score:number, confidence:number, matched:string[]}}
 */
function analyze(text) {
  const clean = String(text || '');
  if (!clean.trim()) return { label: '中性', score: 0, confidence: 0, matched: [] };

  const hits = dropOverlaps([
    ...scanTerms(clean, BULLISH, 1),
    ...scanTerms(clean, BEARISH, -1),
  ]);

  let score = 0;
  const matched = [];

  for (const hit of hits) {
    // 否定會翻轉極性：「不看好」算利空、「不虧損」算利多
    const direction = hit.negated ? -hit.polarity : hit.polarity;
    score += direction * hit.weight;
    matched.push(hit.negated ? `不${hit.term}` : hit.term);
  }

  // 傳聞/預測性語句打折，避免「傳砍單」和「確認砍單」同分
  const hedged = HEDGES.some((pattern) => pattern.test(clean));
  if (hedged) score *= 0.6;

  const magnitude = Math.abs(score);
  const label = score >= 2 ? '利多' : score <= -2 ? '利空' : '中性';

  return {
    label,
    score: +score.toFixed(2),
    // 信心度：命中越多越強，但封頂在 1
    confidence: +Math.min(1, magnitude / 6).toFixed(2),
    matched: [...new Set(matched)].slice(0, 6),
    hedged,
  };
}

/** 一批新聞的情緒統計，用於「今日氛圍」摘要 */
function summarize(items) {
  const counts = { 利多: 0, 利空: 0, 中性: 0 };
  let total = 0;
  for (const item of items) {
    const label = item.sentiment?.label ?? analyze(`${item.title} ${item.summary || ''}`).label;
    counts[label] = (counts[label] || 0) + 1;
    total += item.sentiment?.score ?? 0;
  }
  const net = items.length ? +(total / items.length).toFixed(2) : 0;
  return {
    counts,
    net,
    mood: net >= 1 ? '偏多' : net <= -1 ? '偏空' : '中性',
  };
}

return { analyze, summarize };
})();

const Match = (function () {
/**
 * 把新聞和個股對起來 —— 「個人化標題」的核心。
 *
 * 三種比對強度：
 *  1. 來自個股專屬 feed（news.forSymbols）→ 直接採信，不需猜。
 *  2. 標題/摘要出現四位數代號 → 高信心。
 *  3. 標題/摘要出現公司名稱或別名 → 中信心。
 */

/** 常見的簡稱／別名，補足官方名稱在新聞裡不會出現的情況 */
const ALIASES = new Map([
  ['2330', ['台積電', '台積', 'TSMC']],
  ['2317', ['鴻海', '富士康']],
  ['2454', ['聯發科']],
  ['2308', ['台達電']],
  ['2412', ['中華電']],
  ['2882', ['國泰金']],
  ['2881', ['富邦金']],
  ['2603', ['長榮海運', '長榮']],
  ['2609', ['陽明海運', '陽明']],
  ['3711', ['日月光']],
  ['2303', ['聯電']],
  ['1301', ['台塑']],
  ['1303', ['南亞']],
  ['2002', ['中鋼']],
  ['0050', ['元大台灣50', '台灣50']],
  ['0056', ['元大高股息', '高股息']],
  ['00878', ['國泰永續高股息']],
]);

/**
 * 緊接在數字後面代表「這是數量而不是股票代號」的單位。
 * 少了這道防線，「台股 2026 年展望」會被判成榮科(2026)的新聞。
 */
const QUANTITY_SUFFIX = /^\s*(年|月|日|點|元|億|萬|股|人|家|%|％)/;

function codeHit(text, code) {
  // 用非數字邊界包住，避免 2330 命中「12330」這種數字串
  const re = new RegExp(`(?<![0-9])${code}(?![0-9])`, 'g');
  for (let m = re.exec(text); m; m = re.exec(text)) {
    const after = text.slice(m.index + code.length);
    if (!QUANTITY_SUFFIX.test(after)) return true;
  }
  return false;
}

/**
 * 判斷 name 是否真的出現在 text 裡，且該次出現不是屬於另一家
 * 名字更長的公司。
 *
 * 中文沒有詞界，所以「這次命中的前後是不是中文字」完全不可用來判斷
 * ——「中鋼盤後大單」的中鋼是真命中，後面就是中文字。真正要排除的是
 * 「中鋼構漲停」這種：命中的位置其實是另一家公司（中鋼構）的開頭。
 * 因此改成比對 competitors：只要有任何一次出現不被更長的公司名覆蓋，
 * 就算命中。這也讓「長榮航空與長榮海運雙漲」能正確歸給長榮海運。
 */
function nameHit(text, name, competitors) {
  if (!name) return false;
  const longer = competitors.filter((c) => c.length > name.length && c.includes(name));

  let from = 0;
  for (;;) {
    const at = text.indexOf(name, from);
    if (at === -1) return false;

    // 這次出現是否落在某個更長公司名的範圍內？
    const shadowed = longer.some((c) => {
      const start = at - c.indexOf(name);
      return start >= 0 && text.startsWith(c, start);
    });
    if (!shadowed) return true;

    from = at + name.length;
  }
}

/**
 * 為一則新聞標出相關個股。
 * @param {{title:string, summary?:string, symbols?:string[]}} item
 * @param {Array<{code:string,name:string}>} watchlist 使用者的自選股
 * @param {{allNames?:string[]}} opts allNames 傳入整個市場的公司名稱，
 *        用來判斷短名稱是否其實屬於別家公司（中鋼 vs 中鋼構）。
 *        不傳則只用自選股的名稱比對，誤判率會高一些。
 */
function symbolsFor(item, watchlist, { allNames = [] } = {}) {
  const text = `${item.title || ''} ${item.summary || ''}`;
  const found = new Map();

  // 1. 個股專屬 feed 的標記最可信
  for (const code of item.symbols ?? []) {
    found.set(code, { code, confidence: 'high', via: '個股新聞源' });
  }

  const watchNames = watchlist.flatMap((s) => [s.name, ...(ALIASES.get(s.code) ?? [])]).filter(Boolean);
  const competitors = [...new Set([...allNames, ...watchNames])];

  for (const stock of watchlist) {
    if (found.has(stock.code)) continue;

    // 2. 代號
    if (codeHit(text, stock.code)) {
      found.set(stock.code, { code: stock.code, confidence: 'high', via: '代號' });
      continue;
    }

    // 3. 名稱與別名。自己的名字與別名不能算自己的 competitor，
    //    否則「長榮海運」會把「長榮」遮蔽掉。
    const own = new Set([stock.name, ...(ALIASES.get(stock.code) ?? [])].filter(Boolean));
    const others = competitors.filter((c) => !own.has(c));

    const hit = [...own]
      // 長的名稱先試，命中的資訊比較精確
      .sort((a, b) => b.length - a.length)
      .find((n) => nameHit(text, n, others));

    if (hit) {
      found.set(stock.code, { code: stock.code, confidence: 'medium', via: `名稱「${hit}」` });
    }
  }

  return [...found.values()];
}

return { symbolsFor };
})();

const Recommend = (function () {
/**
 * 個人化推薦引擎。
 *
 * 設計原則：
 *  - 可解釋。每個分數都由具名因子加權而成，且每檔推薦都附上用實際
 *    數字跟市場中位數比較的理由。不做黑箱評分。
 *  - 確定性。同樣的輸入永遠得到同樣的輸出，方便測試與比對。
 *  - 誠實面對缺漏。生技股常沒有本益比（虧損中），這種情況該因子
 *    以中性計分並在理由裡註明，而不是當成 0 分懲罰它。
 *
 * 這是「條件篩選 + 分散度」的排序工具，不是投資建議。
 */

/** 各因子在不同風險偏好下的權重（每組加總為 1） */
const WEIGHTS = {
  conservative: { dividend: 0.32, value: 0.24, liquidity: 0.22, momentum: 0.04, diversify: 0.18 },
  balanced:     { dividend: 0.20, value: 0.24, liquidity: 0.14, momentum: 0.20, diversify: 0.22 },
  aggressive:   { dividend: 0.06, value: 0.14, liquidity: 0.10, momentum: 0.44, diversify: 0.26 },
};

/** 投資目標會再往對應因子加碼（加碼後重新正規化） */
const GOAL_BOOST = {
  dividend: { dividend: 0.15 },
  value:    { value: 0.15 },
  growth:   { momentum: 0.15 },
};

const clamp01 = (n) => Math.max(0, Math.min(1, n));

/** 殖利率的「甜蜜點」與「可疑門檻」（%） */
const YIELD_SWEET_SPOT = 7;
const YIELD_SUSPICIOUS = 9;

/**
 * 殖利率計分：0 → YIELD_SWEET_SPOT 線性上升到滿分，
 * 之後遞減（但保留 0.35 的底），反映「過高的殖利率通常不可持續」。
 */
function dividendScore(yieldPercent) {
  if (yieldPercent <= 0) return 0;
  if (yieldPercent <= YIELD_SWEET_SPOT) return clamp01(yieldPercent / YIELD_SWEET_SPOT);
  return Math.max(0.35, 1 - (yieldPercent - YIELD_SWEET_SPOT) / 8);
}

function median(values) {
  const nums = values.filter((v) => typeof v === 'number' && Number.isFinite(v)).sort((a, b) => a - b);
  if (!nums.length) return null;
  const mid = Math.floor(nums.length / 2);
  return nums.length % 2 ? nums[mid] : (nums[mid - 1] + nums[mid]) / 2;
}

function resolveWeights(risk, goals = []) {
  const base = { ...(WEIGHTS[risk] || WEIGHTS.balanced) };
  for (const goal of goals) {
    for (const [factor, boost] of Object.entries(GOAL_BOOST[goal] || {})) {
      base[factor] = (base[factor] || 0) + boost;
    }
  }
  const total = Object.values(base).reduce((a, b) => a + b, 0);
  return Object.fromEntries(Object.entries(base).map(([k, v]) => [k, v / total]));
}

/**
 * 產生推薦。
 * @param {Array} stocks 股票宇宙
 * @param {object} profile 使用者設定
 * @returns {{items:Array, weights:object, market:object, disclaimer:string}}
 */
function recommend(stocks, profile = {}) {
  const {
    risk = 'balanced',
    goals = [],
    holdings = [],
    watchlist = [],
    excludeIndustries = [],
    minTurnover = 5e7,   // 預設濾掉日成交金額不足 5000 萬的冷門股
    limit = 8,
  } = profile;

  const weights = resolveWeights(risk, goals);

  // 已持有與已在自選清單的不重複推薦；產業分散度以「現有持股」為基準
  const holdingCodes = new Set(holdings.map((h) => h.code));
  const watchCodes = new Set(watchlist.map((w) => (typeof w === 'string' ? w : w.code)));
  const byCode = new Map(stocks.map((s) => [s.code, s]));

  const heldIndustries = new Map();
  for (const code of holdingCodes) {
    const industry = byCode.get(code)?.industry;
    if (industry) heldIndustries.set(industry, (heldIndustries.get(industry) || 0) + 1);
  }

  // 市場中位數：理由裡拿來當比較基準，讓「殖利率高」變成可驗證的敘述
  const market = {
    dividendYield: median(stocks.map((s) => s.dividendYield)),
    peRatio: median(stocks.map((s) => s.peRatio)),
    pbRatio: median(stocks.map((s) => s.pbRatio)),
  };
  const maxTurnover = Math.max(...stocks.map((s) => s.turnover || 0), 1);

  const candidates = stocks.filter((s) => {
    if (holdingCodes.has(s.code) || watchCodes.has(s.code)) return false;
    if (excludeIndustries.includes(s.industry)) return false;
    if ((s.turnover || 0) < minTurnover) return false;
    return typeof s.close === 'number' && s.close > 0;
  });

  const scored = candidates.map((stock) => {
    const factors = {};
    // 理由帶上來源因子，之後才能按「貢獻度」排序，
    // 讓畫面上的第一條理由和標示的主因一致。
    const tagged = [];
    const cautions = [];
    const push = (factor, text) => tagged.push({ factor, text });

    // ── 殖利率：倒 U 型，不是越高越好。
    //    景氣循環股在獲利高點常出現 10%+ 的殖利率，隔年就大幅縮水，
    //    對保守型投資人是風險而非優點，所以超過 SWEET_SPOT 後遞減計分。
    if (typeof stock.dividendYield === 'number') {
      factors.dividend = dividendScore(stock.dividendYield);
      if (market.dividendYield !== null && stock.dividendYield > market.dividendYield * 1.2) {
        push('dividend', `殖利率 ${stock.dividendYield.toFixed(2)}%，高於市場中位數 ${market.dividendYield.toFixed(2)}%`);
      }
      if (stock.dividendYield > YIELD_SUSPICIOUS) {
        cautions.push(`殖利率 ${stock.dividendYield.toFixed(2)}% 異常偏高，須確認是否為一次性配息或獲利已在高點，評分已因此打折`);
      }
    } else {
      factors.dividend = 0.3; // 無股利資料：中性偏低，不當成 0 分懲罰
      push('dividend', '無股利資料（可能尚未配息或處於虧損）');
    }

    // ── 價值：本益比與股價淨值比各半，低者得分高
    const peScore = typeof stock.peRatio === 'number' && stock.peRatio > 0
      ? clamp01(1 - stock.peRatio / 40)
      : 0.4; // 虧損或無資料：中性
    const pbScore = typeof stock.pbRatio === 'number' && stock.pbRatio > 0
      ? clamp01(1 - stock.pbRatio / 6)
      : 0.4;
    factors.value = (peScore + pbScore) / 2;

    if (typeof stock.peRatio === 'number' && market.peRatio !== null && stock.peRatio > 0 && stock.peRatio < market.peRatio * 0.8) {
      push('value', `本益比 ${stock.peRatio.toFixed(1)} 倍，低於市場中位數 ${market.peRatio.toFixed(1)} 倍`);
    }
    if (typeof stock.pbRatio === 'number' && stock.pbRatio < 1) {
      push('value', `股價淨值比 ${stock.pbRatio.toFixed(2)}，低於每股淨值`);
    }
    if (typeof stock.peRatio === 'number' && stock.peRatio > 40) {
      cautions.push(`本益比 ${stock.peRatio.toFixed(1)} 倍偏高，對獲利不如預期較敏感`);
    }

    // ── 動能：當日漲跌幅，±5% 為飽和
    const pct = typeof stock.changePercent === 'number' ? stock.changePercent : 0;
    factors.momentum = clamp01((pct + 5) / 10);
    if (pct >= 2) push('momentum', `今日上漲 ${pct.toFixed(2)}%，短線動能偏強`);
    if (pct <= -2) push('momentum', `今日下跌 ${Math.abs(pct).toFixed(2)}%，屬回檔中的標的`);

    // ── 流動性：成交金額取對數，避免權值股一枝獨秀壓垮其他人
    const turnover = stock.turnover || 0;
    factors.liquidity = clamp01(Math.log10(turnover + 1) / Math.log10(maxTurnover + 1));
    if (turnover >= 1e9) push('liquidity', `日成交金額約 ${(turnover / 1e8).toFixed(1)} 億元，流動性充足`);
    if (turnover < 2e8) cautions.push('成交量偏低，進出可能有滑價');

    // ── 分散度：持股裡沒有的產業給滿分，已重壓的產業遞減
    const heldCount = heldIndustries.get(stock.industry) || 0;
    factors.diversify = heldCount === 0 ? 1 : clamp01(1 / (heldCount + 1));
    if (heldCount === 0 && stock.industry && holdingCodes.size > 0) {
      push('diversify', `${stock.industry}｜你目前持股未涵蓋此產業，可分散集中度`);
    } else if (heldCount >= 2) {
      cautions.push(`你已持有 ${heldCount} 檔${stock.industry}，再加碼會提高產業集中度`);
    }

    const score = Object.entries(weights).reduce(
      (sum, [factor, weight]) => sum + weight * (factors[factor] ?? 0),
      0,
    );

    return {
      code: stock.code,
      name: stock.name,
      market: stock.market,
      industry: stock.industry,
      close: stock.close,
      changePercent: stock.changePercent,
      peRatio: stock.peRatio,
      dividendYield: stock.dividendYield,
      pbRatio: stock.pbRatio,
      score: +score.toFixed(4),
      factors: Object.fromEntries(Object.entries(factors).map(([k, v]) => [k, +v.toFixed(3)])),
      tagged,
      cautions: cautions.slice(0, 2),
    };
  });

  // 主因與理由排序：用「相對候選池平均的突出程度」而不是絕對分數。
  // 持股少時幾乎每檔的 diversify 都是滿分，該因子不具區辨力，
  // 用絕對分數會讓每檔的主因都變成 diversify，資訊量為零。
  const factorNames = Object.keys(weights);
  const means = {};
  for (const name of factorNames) {
    const values = scored.map((s) => s.factors[name] ?? 0);
    means[name] = values.reduce((a, b) => a + b, 0) / (values.length || 1);
  }

  const standout = (item, factor) => (weights[factor] ?? 0) * ((item.factors[factor] ?? 0) - means[factor]);

  for (const item of scored) {
    const ranked = factorNames
      .map((f) => [f, standout(item, f)])
      .sort((a, b) => b[1] - a[1]);

    item.topFactor = ranked[0]?.[1] > 0 ? ranked[0][0] : null;

    const order = new Map(ranked.map(([f], i) => [f, i]));
    item.reasons = item.tagged
      .sort((a, b) => (order.get(a.factor) ?? 99) - (order.get(b.factor) ?? 99))
      .map((t) => t.text)
      .slice(0, 3);
    delete item.tagged;
  }

  // 同分時代號小的在前，確保輸出穩定可測
  scored.sort((a, b) => b.score - a.score || a.code.localeCompare(b.code));

  // 產業上限：避免整份推薦清單都是同一個產業
  const perIndustryCap = Math.max(2, Math.ceil(limit / 3));
  const picked = [];
  const industryCount = new Map();

  for (const item of scored) {
    const key = item.industry || '未分類';
    if ((industryCount.get(key) || 0) >= perIndustryCap) continue;
    industryCount.set(key, (industryCount.get(key) || 0) + 1);
    picked.push(item);
    if (picked.length >= limit) break;
  }

  return {
    items: picked,
    weights,
    market,
    candidateCount: candidates.length,
    disclaimer: '本清單為依你設定的條件所做的排序與分散度計算，不構成投資建議。數據來自公開資訊，請自行核實後再做決策。',
  };
}

return { recommend };
})();

const Portfolio = (function () {
/**
 * 持股損益與組合分析。
 *
 * 費用預設用台股實務值：手續費 0.1425%（買賣各收，多數券商有折扣）、
 * 賣出證交稅 0.3%。這些是預設值而非定論，前端可覆寫。
 */

const FEE_RATE = 0.001425;
const TAX_RATE = 0.003;
const MIN_FEE = 20; // 多數券商的最低手續費

const feeFor = (amount, discount) => Math.max(MIN_FEE, Math.round(amount * FEE_RATE * discount));

/**
 * @param {Array<{code:string, shares:number, cost:number}>} holdings 成本為每股價格
 * @param {Map} byCode 股票宇宙
 * @param {Map} quoteByCode 盤中即時報價（可選，有則優先於收盤價）
 * @param {{feeDiscount?:number, includeFees?:boolean}} opts
 */
function evaluate(holdings, byCode, quoteByCode = new Map(), opts = {}) {
  const { feeDiscount = 0.6, includeFees = true } = opts;

  const positions = [];
  let totalCost = 0;
  let totalValue = 0;

  for (const h of holdings) {
    const shares = Number(h.shares) || 0;
    const cost = Number(h.cost) || 0;
    const stock = byCode.get(h.code);
    const live = quoteByCode.get(h.code);
    const price = live?.price ?? stock?.close ?? null;

    if (!stock && !live) {
      // 查無此代號（下市、輸入錯誤、或今日無資料）。
      // 欄位一律補 null 而不是留空，前端才不會顯示 undefined。
      positions.push({
        code: h.code,
        name: h.name || h.code,
        shares, cost,
        price: null, marketValue: null, costAmount: shares * cost,
        fees: 0, profit: null, profitPercent: null,
        industry: null, market: null, changePercent: null, priceSource: null,
        unknown: true,
      });
      continue;
    }

    const costAmount = shares * cost;
    const marketValue = price !== null ? shares * price : null;

    // 買進手續費 + 賣出手續費 + 證交稅，反映真正落袋的損益
    const buyFee = includeFees ? feeFor(costAmount, feeDiscount) : 0;
    const sellFee = includeFees && marketValue !== null ? feeFor(marketValue, feeDiscount) : 0;
    const tax = includeFees && marketValue !== null ? Math.round(marketValue * TAX_RATE) : 0;
    const fees = buyFee + sellFee + tax;

    const profit = marketValue !== null ? marketValue - costAmount - fees : null;

    totalCost += costAmount + buyFee;
    if (marketValue !== null) totalValue += marketValue - sellFee - tax;

    positions.push({
      code: h.code,
      name: stock?.name || live?.name || h.code,
      industry: stock?.industry ?? null,
      market: stock?.market ?? null,
      shares,
      cost,
      price,
      priceSource: live ? (live.estimated ? '盤中推估' : '盤中') : '收盤',
      changePercent: live?.changePercent ?? stock?.changePercent ?? null,
      costAmount,
      marketValue,
      fees,
      profit,
      profitPercent: profit !== null && costAmount > 0 ? +((profit / costAmount) * 100).toFixed(2) : null,
    });
  }

  positions.sort((a, b) => (b.marketValue || 0) - (a.marketValue || 0));

  // 產業集中度：最大單一產業占比，超過 40% 在畫面上提示
  const byIndustry = new Map();
  for (const p of positions) {
    if (!p.marketValue) continue;
    const key = p.industry || '未分類';
    byIndustry.set(key, (byIndustry.get(key) || 0) + p.marketValue);
  }
  const valueSum = [...byIndustry.values()].reduce((a, b) => a + b, 0);
  const concentration = [...byIndustry.entries()]
    .map(([industry, value]) => ({
      industry,
      value,
      percent: valueSum > 0 ? +((value / valueSum) * 100).toFixed(1) : 0,
    }))
    .sort((a, b) => b.value - a.value);

  const totalProfit = totalValue - totalCost;

  return {
    positions,
    summary: {
      totalCost: Math.round(totalCost),
      totalValue: Math.round(totalValue),
      totalProfit: Math.round(totalProfit),
      totalProfitPercent: totalCost > 0 ? +((totalProfit / totalCost) * 100).toFixed(2) : null,
      positionCount: positions.filter((p) => !p.unknown).length,
    },
    concentration,
    topConcentration: concentration[0] ?? null,
    feeNote: includeFees
      ? `損益已內含手續費 ${(FEE_RATE * feeDiscount * 100).toFixed(4)}%（買賣各一次，最低 ${MIN_FEE} 元）與賣出證交稅 ${(TAX_RATE * 100).toFixed(1)}%`
      : '損益未計入手續費與證交稅',
  };
}

return { evaluate };
})();

const Alerts = (function () {
/**
 * 提醒規則的評估。
 *
 * 規則是純資料（前端存在 localStorage，後端不保存任何個人資料），
 * 這支模組只負責「拿規則和當下行情算出哪些被觸發」，
 * 因此完全可測、無副作用。
 */

/** 支援的規則類型與說明，前端用它產生表單選項 */
const RULE_TYPES = {
  price_above:   { label: '股價高於', unit: '元', needsValue: true },
  price_below:   { label: '股價低於', unit: '元', needsValue: true },
  pct_above:     { label: '單日漲幅超過', unit: '%', needsValue: true },
  pct_below:     { label: '單日跌幅超過', unit: '%', needsValue: true },
  volume_spike:  { label: '成交量放大倍數超過', unit: '倍', needsValue: true },
  news_bullish:  { label: '出現利多新聞', unit: '', needsValue: false },
  news_bearish:  { label: '出現利空新聞', unit: '', needsValue: false },
  event_upcoming:{ label: '天內有除權息或法說會', unit: '天', needsValue: true },
};

const daysBetween = (fromISO, toISO) =>
  Math.round((new Date(toISO).getTime() - new Date(fromISO).getTime()) / 86400000);

/**
 * @param {Array} rules [{id, code, type, value, enabled}]
 * @param {object} ctx { byCode, quoteByCode, news, events, now }
 */
function evaluate(rules, ctx = {}) {
  const {
    byCode = new Map(),
    quoteByCode = new Map(),
    news = [],
    events = [],
    now = new Date().toISOString(),
  } = ctx;

  const triggered = [];
  const skipped = [];

  for (const rule of rules) {
    if (rule.enabled === false) continue;

    const stock = byCode.get(rule.code);
    const live = quoteByCode.get(rule.code);
    const price = live?.price ?? stock?.close ?? null;
    const pct = live?.changePercent ?? stock?.changePercent ?? null;
    const name = stock?.name || live?.name || rule.code;
    const value = Number(rule.value);

    const fire = (message, extra = {}) =>
      triggered.push({ ruleId: rule.id, code: rule.code, name, type: rule.type, message, ...extra });

    switch (rule.type) {
      case 'price_above':
        if (price === null) { skipped.push({ ruleId: rule.id, reason: '取不到價格' }); break; }
        if (price > value) fire(`${name} 現價 ${price} 元，已高於設定的 ${value} 元`, { severity: 'info', price });
        break;

      case 'price_below':
        if (price === null) { skipped.push({ ruleId: rule.id, reason: '取不到價格' }); break; }
        if (price < value) fire(`${name} 現價 ${price} 元，已低於設定的 ${value} 元`, { severity: 'warning', price });
        break;

      case 'pct_above':
        if (pct === null) { skipped.push({ ruleId: rule.id, reason: '取不到漲跌幅' }); break; }
        if (pct >= value) fire(`${name} 今日上漲 ${pct.toFixed(2)}%，超過設定的 ${value}%`, { severity: 'info', pct });
        break;

      case 'pct_below':
        if (pct === null) { skipped.push({ ruleId: rule.id, reason: '取不到漲跌幅' }); break; }
        // 跌幅用絕對值比較，使用者填 3 代表「跌超過 3%」
        if (pct <= -Math.abs(value)) fire(`${name} 今日下跌 ${Math.abs(pct).toFixed(2)}%，超過設定的 ${value}%`, { severity: 'warning', pct });
        break;

      case 'volume_spike': {
        const volume = live?.volume ?? stock?.volume ?? null;
        const baseline = stock?.avgVolume ?? null;
        if (volume === null || !baseline) {
          // 沒有均量基準時明確跳過，而不是拿當日量跟自己比得出假結果
          skipped.push({ ruleId: rule.id, reason: '缺少均量基準，無法計算放大倍數' });
          break;
        }
        const ratio = volume / baseline;
        if (ratio >= value) fire(`${name} 成交量為均量的 ${ratio.toFixed(1)} 倍`, { severity: 'info', ratio });
        break;
      }

      case 'news_bullish':
      case 'news_bearish': {
        const want = rule.type === 'news_bullish' ? '利多' : '利空';
        const hits = news.filter(
          (item) =>
            item.sentiment?.label === want &&
            (item.matchedSymbols || []).some((m) => m.code === rule.code),
        );
        if (hits.length) {
          fire(`${name} 出現 ${hits.length} 則${want}新聞：${hits[0].title}`, {
            severity: want === '利多' ? 'info' : 'warning',
            news: hits.slice(0, 3).map((h) => ({ title: h.title, link: h.link })),
          });
        }
        break;
      }

      case 'event_upcoming': {
        const window = Number.isFinite(value) && value > 0 ? value : 7;
        const upcoming = events
          .filter((e) => e.code === rule.code)
          .map((e) => ({ ...e, inDays: daysBetween(now, e.date) }))
          .filter((e) => e.inDays >= 0 && e.inDays <= window)
          .sort((a, b) => a.inDays - b.inDays);

        if (upcoming.length) {
          const next = upcoming[0];
          fire(
            `${name} ${next.inDays === 0 ? '今日' : `${next.inDays} 天後`}有${next.kind}（${next.date}）`,
            // 事件本身不帶多空方向，用中性色，不要顯示成利多
            { severity: 'neutral', event: next },
          );
        }
        break;
      }

      default:
        skipped.push({ ruleId: rule.id, reason: `未知的規則類型 ${rule.type}` });
    }
  }

  return { triggered, skipped, evaluatedAt: now };
}

return { evaluate, RULE_TYPES };
})();

const Universe = (function () {
/** 依代號或名稱搜尋，給前端的自選股輸入框用 */
function search(stocks, query, limit = 12) {
  const q = String(query || '').trim();
  if (!q) return [];

  const lower = q.toLowerCase();
  const scored = [];

  for (const s of stocks) {
    let score = 0;
    if (s.code === q) score = 100;                              // 代號完全相符
    else if (s.code.startsWith(q)) score = 80;                  // 代號開頭相符
    else if (s.name === q) score = 90;                          // 名稱完全相符
    else if (s.name.startsWith(q)) score = 70;                  // 名稱開頭相符
    else if (s.name.includes(q)) score = 50;                    // 名稱包含
    else if (s.name.toLowerCase().includes(lower)) score = 40;  // 英文名稱
    if (score) scored.push({ stock: s, score });
  }

  return scored
    // 同分時成交值大的排前面 —— 使用者要找的多半是熱門股
    .sort((a, b) => b.score - a.score || (b.stock.turnover || 0) - (a.stock.turnover || 0))
    .slice(0, limit)
    .map((x) => x.stock);
}

function sampleEvents(watchlist) {
  const kinds = ['法說會', '除權息', '月營收'];
  return watchlist.slice(0, 6).map((s, i) => {
    const d = new Date();
    d.setDate(d.getDate() + (i % 5) + 1);
    return { code: s.code, name: s.name, kind: kinds[i % kinds.length], date: d.toISOString().slice(0, 10), detail: null };
  });
}

  const decorated = NEWS.map((item) => ({
    ...item,
    sentiment: Sentiment.analyze(`${item.title} ${item.summary || ''}`),
    matchedSymbols: Match.symbolsFor(item, watchlist, { allNames: ALL_NAMES }),
  }));
  const personalized = decorated.filter((n) => n.matchedSymbols.length > 0);
  const others = decorated.filter((n) => n.matchedSymbols.length === 0);

  const events = sampleEvents(watchlist);

  const watchRows = watchlist.map((w) => {
    const s = BY_CODE.get(w.code);
    return {
      code: w.code, name: s?.name || w.code, market: s?.market ?? null, industry: s?.industry ?? null,
      price: s?.close ?? null, change: s?.change ?? null, changePercent: s?.changePercent ?? null,
      volume: s?.volume ?? null, peRatio: s?.peRatio ?? null, dividendYield: s?.dividendYield ?? null,
      pbRatio: s?.pbRatio ?? null, priceSource: '收盤',
      newsCount: personalized.filter((n) => n.matchedSymbols.some((m) => m.code === w.code)).length,
      unknown: !s,
    };
  });

  const portfolio = Portfolio.evaluate(holdings, BY_CODE, new Map(), {
    feeDiscount: body.feeDiscount, includeFees: body.includeFees !== false,
  });

  const recommendations = Recommend.recommend(STOCKS, {
    risk: body.risk, goals: body.goals, holdings, watchlist,
    excludeIndustries: body.excludeIndustries, limit: body.recommendLimit ?? 8,
  });

  const alerts = Alerts.evaluate(body.rules ?? [], {
    byCode: BY_CODE, quoteByCode: new Map(), news: personalized, events,
    now: new Date().toISOString(),
  });

  const watchCodes = new Set([...watchlist.map((w) => w.code), ...holdings.map((h) => h.code)]);
  const upcoming = events.filter((e) => watchCodes.has(e.code)).sort((a, b) => a.date.localeCompare(b.date));

  return {
    updatedAt: new Date().toISOString(),
    watchlist: watchRows,
    portfolio,
    news: {
      personalized: personalized.slice(0, 40),
      others: others.slice(0, 20),
      mood: Sentiment.summarize(personalized.length ? personalized : decorated.slice(0, 30)),
    },
    recommendations,
    alerts,
    events: upcoming,
    market: {
      total: STOCKS.length,
      gainers: STOCKS.filter((s) => (s.changePercent ?? 0) > 0).length,
      losers: STOCKS.filter((s) => (s.changePercent ?? 0) < 0).length,
      topGainers: [...STOCKS].sort((a, b) => (b.changePercent ?? -99) - (a.changePercent ?? -99)).slice(0, 5),
      topLosers: [...STOCKS].sort((a, b) => (a.changePercent ?? 99) - (b.changePercent ?? 99)).slice(0, 5),
      mostActive: [...STOCKS].sort((a, b) => (b.turnover ?? 0) - (a.turnover ?? 0)).slice(0, 5),
    },
    diagnostics: {
      offline: true, degraded: true, universeFromCache: false,
      universeUpdatedAt: new Date().toISOString(),
      notes: ['這是離線展示版：所有數字來自內建樣本資料，非真實行情'],
      sourceErrors: [],
    },
  };
}

/**
 * 攔截 fetch，把 /api/* 導到本地運算。
 * 這樣 public/app.js 可以原封不動使用，畫面行為與真實版本完全一致。
 */
const passthrough = window.fetch.bind(window);
const asJson = (data) => new Response(JSON.stringify(data), {
  status: 200, headers: { 'Content-Type': 'application/json' },
});

window.fetch = async (url, opts) => {
  const href = String(url);
  if (href === '/api/dashboard') return asJson(buildDashboard(JSON.parse(opts?.body || '{}')));
  if (href.startsWith('/api/search')) {
    const q = new URLSearchParams(href.split('?')[1] || '').get('q') || '';
    return asJson({ query: q, results: Universe.search(STOCKS, q), degraded: true });
  }
  return passthrough(url, opts);
};

})();
</script>
<script>
/* 台股脈動 — 前端邏輯
 *
 * 設計要點：
 *  - 個人化設定全部存 localStorage，每次查詢隨請求送出。後端零狀態。
 *  - 只有一支主要 API（POST /api/dashboard），畫面所有區塊都由它的
 *    回應渲染，避免多支端點之間的資料不一致。
 *  - 台股慣例紅漲綠跌，與歐美相反，全站配色一致遵守。
 */

const STORAGE_KEY = 'tw-stock-pulse/profile/v1';

const DEFAULT_PROFILE = {
  watchlist: ['2330', '2317', '2454', '2881', '2603'],
  holdings: [],
  rules: [],
  risk: 'balanced',
  goals: ['dividend'],
  includeFees: true,
  feeDiscount: 0.6,
  refreshSeconds: 60,
  newsFilter: 'all',
  theme: 'system',
};

/**
 * 主題三段循環：跟隨系統 → 深色 → 淺色。
 *
 * 「跟隨系統」不在 root 上留任何標記，交給 CSS 的 prefers-color-scheme
 * 決定；選了明確的深或淺才寫 data-theme，讓它蓋過系統設定。
 */
const THEMES = [
  ['system', '跟隨系統', 'auto'],
  ['dark', '深色', 'moon'],
  ['light', '淺色', 'sun'],
];

const RISKS = [
  ['conservative', '保守', '重視股利與流動性'],
  ['balanced', '穩健', '兼顧價值與動能'],
  ['aggressive', '積極', '重視短線動能'],
];

const GOALS = [
  ['dividend', '存股領息'],
  ['value', '價值低估'],
  ['growth', '成長動能'],
];

const RULE_TYPES = {
  price_above: { label: '股價高於', unit: '元', needsValue: true },
  price_below: { label: '股價低於', unit: '元', needsValue: true },
  pct_above: { label: '單日漲幅超過', unit: '%', needsValue: true },
  pct_below: { label: '單日跌幅超過', unit: '%', needsValue: true },
  volume_spike: { label: '成交量放大倍數超過', unit: '倍', needsValue: true },
  news_bullish: { label: '出現利多新聞', unit: '', needsValue: false },
  news_bearish: { label: '出現利空新聞', unit: '', needsValue: false },
  event_upcoming: { label: '天內有除權息或法說會', unit: '天', needsValue: true },
};

const TABS = [
  ['overview', '總覽', 'gauge'],
  ['holdings', '持股損益', 'wallet'],
  ['news', '個人化新聞', 'newspaper'],
  ['recommend', '推薦標的', 'lightbulb'],
  ['alerts', '提醒', 'bell'],
  ['settings', '設定', 'gear'],
];

const FACTOR_LABELS = {
  dividend: '股利', value: '價值', momentum: '動能',
  liquidity: '流動性', diversify: '分散度',
};

// ── 狀態 ─────────────────────────────────────────────

function loadProfile() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { ...DEFAULT_PROFILE };
    // 合併預設值，讓舊版存檔在新增欄位後仍可用
    return { ...DEFAULT_PROFILE, ...JSON.parse(raw) };
  } catch {
    return { ...DEFAULT_PROFILE };
  }
}

let profile = loadProfile();
let latest = null;
let refreshTimer = null;
let inFlight = false;

function saveProfile() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
  } catch (err) {
    console.warn('無法寫入 localStorage：', err.message);
  }
}

// ── 小工具 ───────────────────────────────────────────

/**
 * 套用主題。
 *
 * 「跟隨系統」刻意不在 root 上留任何標記，讓 CSS 的 prefers-color-scheme
 * 決定；只有明確選深或淺才寫 data-theme，蓋過系統設定。
 */
function applyTheme(mode) {
  const [, label, icon] = THEMES.find(([key]) => key === mode) || THEMES[0];

  if (mode === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = mode;

  const use = document.getElementById('theme-icon');
  if (use) use.setAttribute('href', `#i-${icon}`);

  const button = document.getElementById('theme-toggle');
  if (button) button.title = `主題：${label}（點擊切換）`;
}

const $ = (id) => document.getElementById(id);

/** 一律escape，新聞標題與公司名稱都來自外部來源 */
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const fmt = (n, digits = 2) =>
  typeof n === 'number' && Number.isFinite(n)
    ? n.toLocaleString('zh-TW', { minimumFractionDigits: digits, maximumFractionDigits: digits })
    : '—';

const fmtInt = (n) =>
  typeof n === 'number' && Number.isFinite(n) ? Math.round(n).toLocaleString('zh-TW') : '—';

/** 金額轉「億／萬」，台股習慣的讀法 */
function fmtMoney(n) {
  if (typeof n !== 'number' || !Number.isFinite(n)) return '—';
  const abs = Math.abs(n);
  if (abs >= 1e8) return `${(n / 1e8).toFixed(2)} 億`;
  if (abs >= 1e4) return `${(n / 1e4).toFixed(1)} 萬`;
  return fmtInt(n);
}

/** 紅漲綠跌 */
const trendClass = (n) =>
  typeof n !== 'number' || !Number.isFinite(n) || n === 0
    ? 'text-muted'
    : n > 0 ? 'text-up' : 'text-down';

const signed = (n, digits = 2) =>
  typeof n === 'number' && Number.isFinite(n) ? `${n > 0 ? '+' : ''}${fmt(n, digits)}` : '—';

const timeAgo = (iso) => {
  if (!iso) return '';
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return '剛剛';
  if (mins < 60) return `${mins} 分鐘前`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return `${hours} 小時前`;
  return `${Math.round(hours / 24)} 天前`;
};

const SENTIMENT_STYLE = {
  利多: 'bg-up-bg text-up border-up-line',
  利空: 'bg-down-bg text-down border-down-line',
  中性: 'bg-raised text-muted border-line',
};

function emptyState(text, icon = 'inbox') {
  return `<div class="py-8 text-center text-faint text-sm">
    <svg class="w-7 h-7 mb-2 mx-auto block opacity-50" aria-hidden="true"><use href="#i-${icon}"/></svg>${esc(text)}</div>`;
}

// ── 資料取得 ─────────────────────────────────────────

async function refresh() {
  if (inFlight) return;
  inFlight = true;
  $('refresh').classList.add('opacity-60', 'pointer-events-none');

  try {
    const res = await fetch('/api/dashboard', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        watchlist: profile.watchlist,
        holdings: profile.holdings,
        rules: profile.rules,
        risk: profile.risk,
        goals: profile.goals,
        includeFees: profile.includeFees,
        feeDiscount: profile.feeDiscount,
      }),
    });
    if (!res.ok) throw new Error(`伺服器回應 ${res.status}`);

    latest = await res.json();
    renderAll();
  } catch (err) {
    showBanner('error', `更新失敗：${err.message}`);
  } finally {
    inFlight = false;
    $('refresh').classList.remove('opacity-60', 'pointer-events-none');
  }
}

function showBanner(kind, message, notes = []) {
  const styles = {
    error: 'bg-danger-bg border-danger-line text-danger',
    warn: 'bg-warn-bg border-warn-line text-warn',
  };
  $('banner').innerHTML = `
    <div class="rounded-lg border px-4 py-3 text-sm ${styles[kind] || styles.warn}">
      <div class="font-medium"><svg class="w-4 h-4 inline-block align-[-0.15em] shrink-0 mr-1.5" aria-hidden="true"><use href="#i-warning"/></svg>${esc(message)}</div>
      ${notes.length ? `<ul class="mt-1.5 space-y-0.5 text-xs opacity-90 list-disc list-inside">
        ${notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
    </div>`;
  $('banner').classList.remove('hidden');
}

// ── 渲染 ─────────────────────────────────────────────

function renderAll() {
  if (!latest) return;

  const d = latest.diagnostics;
  if (d.offline) {
    showBanner('warn', '離線模式：畫面上的數字來自內建樣本資料，非真實行情', d.notes);
  } else if (d.degraded) {
    showBanner('warn', '部分資料來源暫時失效，畫面上的數字可能不完整或稍舊', [...d.notes, ...d.sourceErrors]);
  } else {
    $('banner').classList.add('hidden');
  }

  $('updated').textContent = `更新於 ${new Date(latest.updatedAt).toLocaleTimeString('zh-TW')}`;
  $('side-status').innerHTML = d.offline
    ? '<span class="text-amber-400">離線樣本資料</span>'
    : d.degraded
      ? '<span class="text-amber-400">部分來源異常</span>'
      : '<span class="text-emerald-400">資料正常</span>';

  renderOverview();
  renderHoldings();
  renderNews();
  renderRecommend();
  renderAlerts();
  renderDiagnostics();
}

            <button data-add-watch="${esc(s.code)}" class="ml-3 text-dim hover:text-brand-600" title="加入自選">

function alertRow(a) {

        </thead>
        <tbody class="divide-y divide-line-soft">
          ${pf.positions.map((p) => `
            <tr class="hover:bg-raised ${p.unknown ? 'opacity-60' : ''}">
              <td class="px-5 py-3">
                <div class="font-medium">${esc(p.name)}</div>
                <div class="text-xs text-muted num">${esc(p.code)}
                  ${p.unknown ? '<span class="ml-1 text-warn">查無此代號</span>'
                              : p.priceSource ? `<span class="ml-1 text-faint">${esc(p.priceSource)}</span>` : ''}
                </div>
              </td>
              <td class="px-3 py-3 text-right num">${fmtInt(p.shares)}</td>
              <td class="px-3 py-3 text-right num">${fmt(p.cost)}</td>
              <td class="px-3 py-3 text-right num">${fmt(p.price)}</td>
              <td class="px-3 py-3 text-right num">${fmtMoney(p.marketValue)}</td>
              <td class="px-3 py-3 text-right num ${trendClass(p.profit)}">
                ${fmtMoney(p.profit)}
                <div class="text-xs">${p.profitPercent !== null ? signed(p.profitPercent) + '%' : ''}</div>
              </td>
              <td class="px-3 py-3 text-right">
                <button data-remove-holding="${esc(p.code)}" class="text-faint hover:text-danger px-1" title="移除">
                  <svg class="w-4 h-4 inline-block align-[-0.15em] shrink-0" aria-hidden="true"><use href="#i-xmark"/></svg>
                </button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`;

  const conc = pf.concentration;
  $('concentration').innerHTML = conc.length === 0
    ? emptyState('尚無持股資料', 'chart-pie')
    : conc.map((c) => `
        <div>
          <div class="flex justify-between text-sm mb-1">
            <span>${esc(c.industry)}</span>
            <span class="num ${c.percent > 40 ? 'text-warn font-medium' : 'text-sub'}">${fmt(c.percent, 1)}%</span>
          </div>
          <div class="h-2 bg-track rounded-full overflow-hidden">
            <div class="h-full ${c.percent > 40 ? 'bg-warn-strong' : 'bg-brand-500'}" style="width:${Math.min(100, c.percent)}%"></div>
          </div>
        </div>`).join('')
      + (pf.topConcentration && pf.topConcentration.percent > 40
        ? `<p class="text-xs text-warn bg-warn-bg border border-warn-line rounded-lg px-3 py-2 mt-3">
             <svg class="w-4 h-4 inline-block align-[-0.15em] shrink-0 mr-1" aria-hidden="true"><use href="#i-warning"/></svg>
             ${esc(pf.topConcentration.industry)}占比 ${fmt(pf.topConcentration.percent, 1)}%，產業集中度偏高。
             「推薦標的」分頁會優先推你尚未持有的產業。</p>`
        : '');
}

function renderNews() {
  const { personalized, others, mood } = latest.news;

  const moodStyle = mood.mood === '偏多' ? 'text-up' : mood.mood === '偏空' ? 'text-down' : 'text-muted';
  $('news-mood').innerHTML = `
    <span class="text-muted">自選股新聞氛圍</span>
    <span class="ml-2 font-semibold ${moodStyle}">${esc(mood.mood)}</span>
    <span class="ml-2 text-xs text-muted num">（利多 ${mood.counts.利多} · 利空 ${mood.counts.利空} · 中性 ${mood.counts.中性}）</span>`;

  const filters = [['all', '全部'], ['利多', '利多'], ['利空', '利空']];
  $('news-filters').innerHTML = filters.map(([key, label]) => `
    <button data-news-filter="${key}" class="px-3 py-1.5 text-xs rounded-lg border ${
      profile.newsFilter === key ? 'bg-brand-600 text-white border-brand-600' : 'bg-surface border-line text-sub'
    }">${esc(label)}</button>`).join('');

  const shown = profile.newsFilter === 'all'
    ? personalized
    : personalized.filter((n) => n.sentiment.label === profile.newsFilter);

  $('news-personalized').innerHTML = shown.length === 0
    ? emptyState(personalized.length === 0
        ? '目前沒有跟你自選股相關的新聞'
        : `沒有${profile.newsFilter}新聞`, 'newspaper')
    : shown.map(newsCard).join('');

  $('news-others').innerHTML = others.length === 0
    ? emptyState('沒有其他新聞', 'newspaper')
    : others.map(newsCard).join('');
}

function newsCard(n) {
  const s = n.sentiment;
  return `<article class="bg-surface rounded-xl border border-line p-4">
    <div class="flex items-start gap-3">
      <span class="shrink-0 px-2 py-0.5 rounded border text-xs ${SENTIMENT_STYLE[s.label]}">${esc(s.label)}</span>
      <div class="min-w-0 flex-1">
        <h3 class="font-medium leading-snug">
          ${n.link ? `<a href="${esc(n.link)}" target="_blank" rel="noopener" class="hover:text-brand-700">${esc(n.title)}</a>`
                   : esc(n.title)}
        </h3>
        ${n.summary ? `<p class="text-sm text-sub mt-1 leading-relaxed line-clamp-2">${esc(n.summary)}</p>` : ''}
        <div class="flex flex-wrap items-center gap-1.5 mt-2 text-xs">
          ${n.matchedSymbols.map((m) => `
            <span class="px-1.5 py-0.5 rounded bg-accent-bg text-accent-ink num" title="比對方式：${esc(m.via)}">
              ${esc(m.code)}
            </span>`).join('')}
          <span class="text-faint">${esc(n.source || '')}</span>
          <span class="text-faint">${esc(timeAgo(n.publishedAt))}</span>
          ${s.hedged ? '<span class="text-warn" title="標題含「傳」「可能」等推測語氣，情緒分數已打折">推測語氣</span>' : ''}
          ${s.matched.length ? `<span class="text-faint">關鍵詞：${esc(s.matched.join('、'))}</span>` : ''}
        </div>
      </div>
    </div>
  </article>`;
}

function renderRecommend() {
  const r = latest.recommendations;

  $('risk-picker').innerHTML = RISKS.map(([key, label, hint]) => `
    <button data-risk="${key}" title="${esc(hint)}" class="px-3.5 py-2 text-sm rounded-lg border ${
      profile.risk === key ? 'bg-brand-600 text-white border-brand-600' : 'bg-surface border-line text-sub hover:bg-raised'
    }">${esc(label)}</button>`).join('');

  $('goal-picker').innerHTML = GOALS.map(([key, label]) => `
    <button data-goal="${key}" class="px-3.5 py-2 text-sm rounded-lg border ${
      profile.goals.includes(key) ? 'bg-brand-600 text-white border-brand-600' : 'bg-surface border-line text-sub hover:bg-raised'
    }">${esc(label)}</button>`).join('');

  $('weights').innerHTML = Object.entries(r.weights)
    .sort((a, b) => b[1] - a[1])
    .map(([factor, weight]) => `
      <span class="px-2.5 py-1 rounded-lg bg-track text-xs num">
        ${esc(FACTOR_LABELS[factor] || factor)} ${(weight * 100).toFixed(0)}%
      </span>`).join('');

  $('recommend-list').innerHTML = r.items.length === 0
    ? emptyState('沒有符合條件的標的', 'lightbulb')
    : r.items.map((item) => `
        <div class="bg-surface rounded-xl border border-line p-4">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="font-semibold">${esc(item.name)}
                <span class="text-sm text-muted num ml-1">${esc(item.code)}</span>
              </div>
              <div class="text-xs text-muted mt-0.5">
                ${esc(item.market || '')}${item.industry ? ` · ${esc(item.industry)}` : ''}
                ${item.topFactor ? ` · 主因：${esc(FACTOR_LABELS[item.topFactor] || item.topFactor)}` : ''}
              </div>
            </div>
            <div class="text-right shrink-0">
              <div class="num font-medium">${fmt(item.close)}</div>
              <div class="text-xs num ${trendClass(item.changePercent)}">${signed(item.changePercent)}%</div>
            </div>
          </div>

          <div class="mt-3 flex items-center gap-2">
            <div class="flex-1 h-1.5 bg-track rounded-full overflow-hidden">
              <div class="h-full score-bar" style="width:${Math.round(item.score * 100)}%"></div>
            </div>
            <span class="text-xs text-muted num">${(item.score * 100).toFixed(0)} 分</span>
          </div>

          <div class="mt-3 flex flex-wrap gap-x-3 gap-y-1 text-xs text-sub num">
            <span>本益比 ${fmt(item.peRatio, 1)}</span>
            <span>殖利率 ${item.dividendYield !== null ? fmt(item.dividendYield) + '%' : '—'}</span>
            <span>淨值比 ${fmt(item.pbRatio)}</span>
          </div>

          ${item.reasons.length ? `<ul class="mt-3 space-y-1">
            ${item.reasons.map((reason) => `<li class="text-sm text-ink flex gap-1.5">
              <svg class="w-3 h-3 inline-block align-[-0.15em] shrink-0 text-brand-500 mt-1" aria-hidden="true"><use href="#i-check"/></svg><span>${esc(reason)}</span></li>`).join('')}
          </ul>` : ''}

          ${item.cautions.length ? `<ul class="mt-2 space-y-1">
            ${item.cautions.map((c) => `<li class="text-sm text-warn flex gap-1.5">
              <svg class="w-3 h-3 inline-block align-[-0.15em] shrink-0 mt-1" aria-hidden="true"><use href="#i-warning"/></svg><span>${esc(c)}</span></li>`).join('')}
          </ul>` : ''}

          <button data-add-watch="${esc(item.code)}"
                  class="mt-3 w-full py-2 text-sm rounded-lg border border-accent-line text-accent-ink hover:bg-accent-bg">
            <svg class="w-4 h-4 inline-block align-[-0.15em] shrink-0 mr-1" aria-hidden="true"><use href="#i-star"/></svg>加入自選
          </button>
        </div>`).join('');

  $('recommend-disclaimer').innerHTML = `<svg class="w-4 h-4 inline-block align-[-0.15em] shrink-0 mr-1" aria-hidden="true"><use href="#i-info"/></svg>${esc(r.disclaimer)}
    　候選池 ${r.candidateCount} 檔（已排除已持有、已在自選、成交量過低者）。`;
}

function renderAlerts() {
  const watch = latest.watchlist;
  const holdingCodes = latest.portfolio.positions.map((p) => ({ code: p.code, name: p.name }));
  const options = [...watch, ...holdingCodes]
    .filter((s, i, arr) => arr.findIndex((x) => x.code === s.code) === i);

  const prevCode = $('a-code').value;
  $('a-code').innerHTML = options.length === 0
    ? '<option value="">請先加入自選股</option>'
    : options.map((s) => `<option value="${esc(s.code)}">${esc(s.code)} ${esc(s.name)}</option>`).join('');
  if (prevCode && options.some((o) => o.code === prevCode)) $('a-code').value = prevCode;

  if (!$('a-type').options.length) {
    $('a-type').innerHTML = Object.entries(RULE_TYPES)
      .map(([key, t]) => `<option value="${key}">${esc(t.label)}</option>`).join('');
    syncRuleValueField();
  }

  $('alerts-triggered').innerHTML = latest.alerts.triggered.length === 0
    ? emptyState('目前沒有觸發的提醒', 'bell-slash')
    : latest.alerts.triggered.map(alertRow).join('');

  const skipped = new Map(latest.alerts.skipped.map((s) => [s.ruleId, s.reason]));
  $('alerts-rules').innerHTML = profile.rules.length === 0
    ? emptyState('還沒有設定提醒規則', 'bell')
    : profile.rules.map((rule) => {
        const t = RULE_TYPES[rule.type] || { label: rule.type, unit: '' };
        const stock = latest.watchlist.find((s) => s.code === rule.code);
        const isSkipped = skipped.has(rule.id);
        return `<div class="flex items-center gap-2 text-sm py-1.5">
          <input type="checkbox" data-toggle-rule="${esc(rule.id)}" ${rule.enabled === false ? '' : 'checked'}
                 class="w-4 h-4 accent-brand-600 shrink-0">
          <div class="min-w-0 flex-1 ${rule.enabled === false ? 'opacity-50' : ''}">
            <span class="num">${esc(rule.code)}</span>
            <span class="text-sub">${esc(stock ? stock.name : '')}</span>
            <span class="text-muted">${esc(t.label)}</span>
            ${t.needsValue ? `<span class="num font-medium">${esc(rule.value)}${esc(t.unit)}</span>` : ''}
            ${isSkipped ? `<div class="text-xs text-warn">無法評估：${esc(skipped.get(rule.id))}</div>` : ''}
          </div>
          <button data-remove-rule="${esc(rule.id)}" class="text-faint hover:text-danger px-1 shrink-0">
            <svg class="w-4 h-4 inline-block align-[-0.15em] shrink-0" aria-hidden="true"><use href="#i-xmark"/></svg>
          </button>
        </div>`;
      }).join('');
}

function renderDiagnostics() {
  const d = latest.diagnostics;
  const rows = [
    ['模式', d.offline ? '離線（樣本資料）' : '線上'],
    ['股票宇宙', `${latest.market.total} 檔 · ${d.universeFromCache ? '來自快取' : '即時抓取'}`],
    ['更新時間', new Date(d.universeUpdatedAt).toLocaleString('zh-TW')],
  ];

  $('diagnostics').innerHTML = rows.map(([k, v]) => `
      <div class="flex justify-between gap-3">
        <span class="text-muted">${esc(k)}</span><span class="num text-right">${esc(v)}</span>
      </div>`).join('')
    + (d.sourceErrors.length
      ? `<div class="pt-2 mt-2 border-t border-line-soft">
           <div class="text-muted mb-1">來源訊息</div>
           <ul class="space-y-1 text-xs text-warn list-disc list-inside">
             ${d.sourceErrors.map((e) => `<li>${esc(e)}</li>`).join('')}
           </ul>
         </div>`
      : '<div class="pt-2 mt-2 border-t border-line-soft text-xs text-ok">所有來源正常</div>');
}

// ── 互動 ─────────────────────────────────────────────

function syncRuleValueField() {
  const type = RULE_TYPES[$('a-type').value];
  const needs = type?.needsValue !== false;
  $('a-value-wrap').style.display = needs ? '' : 'none';
  $('a-unit').textContent = needs && type?.unit ? `(${type.unit})` : '';
}

function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach((el) => el.classList.remove('active'));
  $(`tab-${name}`)?.classList.add('active');

  document.querySelectorAll('[data-tab]').forEach((el) => {
    const active = el.dataset.tab === name;
    el.className = `w-full flex items-center gap-2.5 px-5 py-2.5 text-sm transition ${
      active ? 'bg-brand-600/15 text-white border-r-2 border-brand-500' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'
    }`;
  });

  location.hash = name;

  // 手機上選完分頁就把浮層選單收起來，否則會一直蓋住內容
  if (window.matchMedia('(max-width: 767px)').matches) closeMobileMenu();
}

function setMobileMenu(open) {
  const aside = document.querySelector('aside');
  aside.classList.toggle('hidden', !open);
  aside.classList.toggle('flex', open);
  $('backdrop').classList.toggle('hidden', !open);
}

const closeMobileMenu = () => setMobileMenu(false);

function addToWatchlist(code) {
  if (!code || profile.watchlist.includes(code)) return;
  profile.watchlist.push(code);
  saveProfile();
  refresh();
}

let searchTimer = null;

function initEvents() {
  $('nav').innerHTML = TABS.map(([key, label, icon]) => `
    <button data-tab="${key}" class="w-full flex items-center gap-2.5 px-5 py-2.5 text-sm text-slate-400">
      <svg class="w-4 h-4 shrink-0" aria-hidden="true"><use href="#i-${icon}"/></svg>${esc(label)}
    </button>`).join('');

  document.addEventListener('click', (event) => {
    const target = event.target.closest('[data-tab], [data-add-watch], [data-remove-watch], [data-remove-holding], [data-risk], [data-goal], [data-news-filter], [data-remove-rule]');
    if (!target) return;

    const d = target.dataset;

    if (d.tab) return switchTab(d.tab);

    if (d.addWatch) return addToWatchlist(d.addWatch);

    if (d.removeWatch) {
      profile.watchlist = profile.watchlist.filter((c) => c !== d.removeWatch);
      saveProfile();
      return refresh();
    }

    if (d.removeHolding) {
      profile.holdings = profile.holdings.filter((h) => h.code !== d.removeHolding);
      saveProfile();
      return refresh();
    }

    if (d.risk) {
      profile.risk = d.risk;
      saveProfile();
      return refresh();
    }

    if (d.goal) {
      profile.goals = profile.goals.includes(d.goal)
        ? profile.goals.filter((g) => g !== d.goal)
        : [...profile.goals, d.goal];
      saveProfile();
      return refresh();
    }

    if (d.newsFilter) {
      profile.newsFilter = d.newsFilter;
      saveProfile();
      return renderNews();
    }

    if (d.removeRule) {
      profile.rules = profile.rules.filter((r) => r.id !== d.removeRule);
      saveProfile();
      return refresh();
    }
  });

  document.addEventListener('change', (event) => {
    const id = event.target.dataset.toggleRule;
    if (!id) return;
    const rule = profile.rules.find((r) => r.id === id);
    if (rule) {
      rule.enabled = event.target.checked;
      saveProfile();
      refresh();
    }
  });

  $('refresh').addEventListener('click', refresh);

  $('theme-toggle').addEventListener('click', () => {
    const at = THEMES.findIndex(([key]) => key === profile.theme);
    profile.theme = THEMES[(at + 1) % THEMES.length][0];
    saveProfile();
    applyTheme(profile.theme);
  });
  $('mobile-menu').addEventListener('click', () => {
    setMobileMenu(document.querySelector('aside').classList.contains('hidden'));
  });
  $('backdrop').addEventListener('click', closeMobileMenu);

  // ── 搜尋
  $('search').addEventListener('input', (event) => {
    const query = event.target.value.trim();
    clearTimeout(searchTimer);

    if (query.length < 1) return $('search-results').classList.add('hidden');

    // debounce：避免每個按鍵都打一次 API
    searchTimer = setTimeout(async () => {
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const { results } = await res.json();

        $('search-results').innerHTML = results.length === 0
          ? '<div class="px-3 py-3 text-sm text-muted">查無符合的標的</div>'
          : results.map((s) => `
              <button data-add-watch="${esc(s.code)}"
                      class="w-full text-left px-3 py-2.5 hover:bg-raised flex items-center justify-between gap-2">
                <span class="min-w-0">
                  <span class="font-medium">${esc(s.name)}</span>
                  <span class="text-xs text-muted num ml-1.5">${esc(s.code)}</span>
                  <span class="text-xs text-faint ml-1">${esc(s.industry || s.market || '')}</span>
                </span>
                <span class="text-xs num shrink-0 ${trendClass(s.changePercent)}">${signed(s.changePercent)}%</span>
              </button>`).join('');

        $('search-results').classList.remove('hidden');
      } catch {
        $('search-results').classList.add('hidden');
      }
    }, 250);
  });

  $('search').addEventListener('blur', () => setTimeout(() => $('search-results').classList.add('hidden'), 150));

  // ── 持股新增
  $('h-add').addEventListener('click', () => {
    const code = $('h-code').value.trim();
    const shares = Number($('h-shares').value);
    const cost = Number($('h-cost').value);

    if (!code || !(shares > 0) || !(cost >= 0)) {
      alert('請填入代號、股數與每股成本');
      return;
    }

    const existing = profile.holdings.find((h) => h.code === code);
    if (existing) {
      // 同一檔再買進：改成加權平均成本，而不是覆蓋
      const totalShares = existing.shares + shares;
      existing.cost = +(((existing.cost * existing.shares) + (cost * shares)) / totalShares).toFixed(4);
      existing.shares = totalShares;
    } else {
      profile.holdings.push({ code, shares, cost });
    }

    if (!profile.watchlist.includes(code)) profile.watchlist.push(code);
    saveProfile();

    $('h-code').value = $('h-shares').value = $('h-cost').value = '';
    refresh();
  });

  // ── 提醒新增
  $('a-type').addEventListener('change', syncRuleValueField);
  $('a-add').addEventListener('click', () => {
    const code = $('a-code').value;
    const type = $('a-type').value;
    const meta = RULE_TYPES[type];

    if (!code) { alert('請先加入自選股'); return; }

    const value = meta.needsValue ? Number($('a-value').value) : null;
    if (meta.needsValue && !Number.isFinite(value)) { alert(`請填入數值（${meta.unit}）`); return; }

    profile.rules.push({
      id: `r${Date.now()}${Math.random().toString(36).slice(2, 6)}`,
      code, type, value, enabled: true,
    });
    saveProfile();
    $('a-value').value = '';
    refresh();
  });

  // ── 設定
  $('s-fees').checked = profile.includeFees;
  $('s-discount').value = profile.feeDiscount;
  $('s-interval').value = profile.refreshSeconds;

  $('s-fees').addEventListener('change', (e) => {
    profile.includeFees = e.target.checked; saveProfile(); refresh();
  });
  $('s-discount').addEventListener('change', (e) => {
    profile.feeDiscount = Math.max(0.1, Math.min(1, Number(e.target.value) || 0.6));
    e.target.value = profile.feeDiscount; saveProfile(); refresh();
  });
  $('s-interval').addEventListener('change', (e) => {
    profile.refreshSeconds = Math.max(0, Number(e.target.value) || 0);
    saveProfile(); scheduleRefresh();
  });

  $('export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(profile, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `tw-stock-pulse-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $('import').addEventListener('change', async (event) => {
    const file = event.target.files?.[0];
    if (!file) return;
    try {
      const incoming = JSON.parse(await file.text());
      profile = { ...DEFAULT_PROFILE, ...incoming };
      saveProfile();
      location.reload();
    } catch (err) {
      alert(`匯入失敗：${err.message}`);
    }
  });

  $('reset').addEventListener('click', () => {
    if (!confirm('確定要清除所有自選股、持股與提醒規則嗎？此動作無法復原。')) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  });
}

function scheduleRefresh() {
  clearInterval(refreshTimer);
  if (profile.refreshSeconds > 0) {
    refreshTimer = setInterval(refresh, profile.refreshSeconds * 1000);
  }
}

// ── 啟動 ─────────────────────────────────────────────

applyTheme(profile.theme);
initEvents();
applyTheme(profile.theme);   // 按鈕是 initEvents 之後才存在，圖示要再同步一次
switchTab(location.hash.replace('#', '') || 'overview');
refresh();
scheduleRefresh();

</script>
</body>
</html>
